<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B面サイト管理システム</title>
<style>
:root{
  --sidew:230px;
  --bg:#f6f1e7; --side:#fbf8f1; --panel:#ffffff; --panel2:#f6efe2;
  --border:#e6dcc8; --text:#3d352a; --muted:#8a7f6a;
  --accent:#c9a87c; --accent2:#a5825c;
  --red:#d05b5b; --green:#6da06d;
}
@media(min-width:2200px){:root{--sidew:260px} body{font-size:16px}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'M Rounded 1c','Rounded Mplus 1c','Hiragino Maru Gothic ProN','BIZ UDPGothic','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;font-weight:600;letter-spacing:-0.01em}
#app{display:flex;height:100vh}
.sidebar{width:var(--sidew);background:linear-gradient(180deg,#fdfbf7,#f4ecdd);
  border-right:2px solid var(--border);
  padding:18px 12px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;
  box-shadow:inset -8px 0 14px -10px rgba(140,120,70,.25)}
.logo{font-weight:900;font-size:18px;padding:8px 12px 16px;color:#7a5934;
  text-shadow:0 1px 0 #ffffff,0 2px 6px rgba(140,120,70,.35);letter-spacing:.02em}
.menu-item{padding:10px 14px;border-radius:14px;cursor:pointer;margin:7px 2px;color:var(--text);
  background:linear-gradient(145deg,#ffffff,#f3ecdd);border:2px solid var(--border);
  box-shadow:0 3px 0 rgba(165,130,92,.18),0 6px 12px -5px rgba(140,120,70,.25);transition:.15s;font-weight:700}
.menu-item:hover{transform:translateY(-1px);
  box-shadow:0 4px 0 rgba(165,130,92,.25),0 10px 16px -6px rgba(140,120,70,.3)}
.menu-item.active{background:linear-gradient(145deg,#eadfc6,#e0cfae);color:#5b431a;font-weight:900;
  box-shadow:inset 0 2px 5px rgba(107,83,34,.22),0 2px 0 #ffffff;border-color:#d4b68c}
.menu-item.sub{padding-left:24px;font-size:13px;color:var(--muted);margin-left:14px;
  background:linear-gradient(145deg,#fbf8f1,#f3ecdd);border-radius:12px;border:1px solid var(--border)}
.menu-item.sub.active{color:#5b431a;font-weight:800}
.main{margin-left:var(--sidew);width:calc(100% - var(--sidew));height:100vh;
  display:flex;flex-direction:column;padding:16px 22px;overflow:hidden}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex:0 0 auto}
.tb-title{font-size:20px;font-weight:900;flex:1;color:var(--text)}
#searchBox{width:180px;background:#fdfbf6;border:2px solid var(--border);color:var(--text);border-radius:12px;padding:9px 14px;font-weight:700}
#langSelect{width:120px;background:#fdfbf6;border:2px solid var(--accent);color:var(--text);border-radius:12px;padding:9px 8px;font-weight:800;cursor:pointer}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:800;cursor:pointer;color:#fff;
  box-shadow:0 3px 0 rgba(140,120,70,.2),0 5px 12px -4px rgba(140,120,70,.3);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(145deg,#d4b68c,#c9a87c)}
.btn-outline{background:transparent;border:2px solid var(--accent2);color:var(--accent2);box-shadow:none}
.btn-ghost{background:linear-gradient(145deg,#ffffff,#f3ecdd);border:2px solid var(--border);color:var(--text)}
.btn-danger{background:transparent;border:2px solid var(--red);color:var(--red);box-shadow:none}
.btn.sm{padding:5px 12px;font-size:12px;border-radius:10px}
#content{flex:1;min-height:0;overflow:auto}
.card{background:var(--panel);border:2px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:12px;
  box-shadow:0 3px 0 rgba(140,120,70,.06),0 8px 18px -8px rgba(140,120,70,.18)}
.muted{color:var(--muted)}
.req{color:var(--red)}
.sechead{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;margin-bottom:12px}
.sechead.big{font-size:18px;margin-bottom:14px}
.platgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0}
.phead{display:flex;align-items:center;gap:8px;font-weight:800}
.plat{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.plat i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{border-radius:999px;padding:3px 10px;font-size:11px;color:#fff;font-weight:800}
.st-draft{background:#a9a196}.st-review{background:#d9a53f}
.st-scheduled{background:#a08bd0}.st-published{background:#7aa3d8}.st-archived{background:#bdb5a6}
.qcard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;text-decoration:none;color:var(--text);
  box-shadow:0 2px 0 rgba(140,120,70,.08),0 6px 14px -8px rgba(140,120,70,.22);transition:.15s}
.qcard:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(140,120,70,.12),0 10px 18px -8px rgba(140,120,70,.3)}
.qlogo{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.08);flex:0 0 auto}
.qlogo img{width:24px;height:24px}
.qfall{width:24px;height:24px;border-radius:6px;color:#fff;font-weight:900;font-size:13px}
.qname{font-weight:900;font-size:14px}
.qopen{font-size:10px;color:var(--muted);letter-spacing:.05em;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{color:var(--muted);font-size:12px;text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-weight:800}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0e9db;font-size:13px;font-weight:700}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover{background:#f8f3e8}
.quickbar{display:flex;gap:8px;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;color:var(--muted);margin-bottom:5px;font-size:12px;font-weight:800}
input,textarea,select{width:100%;background:#fdfbf6;border:2px solid var(--border);color:var(--text);border-radius:12px;padding:9px 12px;font-size:14px;font-family:inherit;font-weight:700}
input[type=color]{padding:2px;height:40px}
textarea{min-height:70px;resize:vertical}
textarea.big{min-height:120px}
.help{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5;font-weight:700}
.count{font-size:11px;color:var(--muted);text-align:right;margin-top:2px;font-weight:800}
.count.over{color:var(--red);font-weight:900}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(min-width:2200px){.fgrid{grid-template-columns:1fr 1fr 1fr}}
.full{grid-column:1/-1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tagbox{display:flex;flex-wrap:wrap;gap:4px;background:#fdfbf6;border:2px solid var(--border);border-radius:12px;padding:6px}
.tagbox input{flex:1;min-width:120px;background:transparent;border:none;padding:4px;font-weight:700}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:4px;align-items:center;font-weight:700}
.chipx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:900}
.imgprev{max-width:120px;border-radius:10px;margin-top:6px;display:block}
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
#saveFlash{opacity:0;transition:.4s;color:var(--green);font-size:12px;font-weight:800}
#saveFlash.on{opacity:1}
.filter{width:auto;margin-left:auto}
.flist .frow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0e9db;font-size:13px;font-weight:700}
.ftype{color:var(--muted);font-size:11px;background:var(--panel2);border-radius:6px;padding:2px 8px;font-weight:800}
.pcard{cursor:pointer}
.pcard:hover{border-color:var(--accent2)}
.pname{font-weight:900;font-size:15px;margin:6px 0 2px}
.pv-light{background:#fff;color:#111827;border:2px solid var(--border);border-radius:16px;padding:18px;max-width:640px;
  box-shadow:0 6px 20px rgba(140,120,70,.10)}
.pv-light .pv-name{font-weight:800;font-size:13px}
.pv-light .pv-handle{color:#6b7280;font-size:12px;font-weight:700}
.pv-light .pv-body{white-space:pre-wrap;margin-top:8px;font-size:14px;line-height:1.7;font-weight:700}
.pv-light .pv-tag{color:#1d9bf0;font-weight:800}
.pv-img{width:100%;border-radius:12px;margin-top:10px;max-height:240px;object-fit:cover}
.pv-ph{border-radius:12px;margin-top:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-align:center;padding:24px}
.pv-meta{color:#6b7280;font-size:12px;margin-top:10px;border-top:1px solid #e5e7eb;padding-top:8px;font-weight:700}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--border);color:var(--text);padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 6px 20px rgba(140,120,70,.18);font-weight:800}
#toast.show{opacity:1}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<noscript><p style="padding:20px">JavaScript를有効にしてください。</p></noscript>
<script>
window.addEventListener('error',function(e){
  if(e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'LINK')) return;
  var p=document.createElement('pre');
  p.style.cssText='position:fixed;top:0;left:0;right:0;background:#f7e6e6;color:#8c3a3a;border-bottom:2px solid #e4c6c6;padding:10px 14px;z-index:999;font-size:13px;font-weight:800;margin:0';
  p.textContent='エラー: '+(e.message||'Unknown Error')+' (行 '+(e.lineno||'')+')';
  document.body.appendChild(p);
},true);
</script>

function hslToHex(h,s,l){s/=100;l/=100;
  var c=(1-Math.abs(2*l-1))*s;var x=c*(1-Math.abs((h/60)%2-1));var m=l-c/2;var r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
  function to(v){v=Math.round((v+m)*255);return ('0'+v.toString(16)).slice(-2);}
  return '#'+to(r)+to(g)+to(b);}
function pastelFromName(s){var h=0;var str=String(s||'link');
  for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}
  return hslToHex(h%360,60,68);}

function $(s){return document.querySelector(s);}
function esc(s){if(s==null)s='';return String(s).replace(/[&<>"']/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&#34;',"'":'&#39;'}[m];});}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad2(n){return (n<10?'0':'')+n;}
function nowISO(){return new Date().toISOString().slice(0,16);}
function fmtDT(iso){if(!iso)return '—';var d=new Date(iso);
  if(isNaN(d.getTime()))return esc(iso);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function findIn(arr,id){if(!Array.isArray(arr))return null;for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function getTemplate(id){return findIn(TEMPLATES,id)||(TEMPLATES[0]||{id:'',name:'',fields:[]});}
function getPlatform(id){return findIn(PLATFORMS,id)||(PLATFORMS[0]||{id:'',name:'',color:'#000'});}
function statusOf(id){

function defaultTemplateFor(pid){var map={x:'x-post',instagram:'ig-post',blog:'blog-post',
  youtube:'yt-script',ririi:'ririi-generic',wakuwaku:'waku-generic',

  var t=findIn(TEMPLATES,map[pid]);
  if(t)return t;
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].platform===pid)return TEMPLATES[i];}
  return TEMPLATES[0]||{id:'',name:'',fields:[]};}

  db.contents.unshift(c);save();toast('作成画面を開きました');openEdit(c.id);}
function gatherText(c){var tpl=getTemplate(c.templateId);var parts=[];
  if(!tpl || !tpl.fields) return '';
  for(var i=0;i<tpl.fields.length;i++){var f=tpl.fields[i];var v=c.values[f.key];
    if(v&&f.type!=='image'&&f.type!=='url'&&f.type!=='tags')parts.push(String(v));}
  return parts.join('\n');}
function convertTo(srcId,pid){var src=findIn(db.contents,srcId);if(!src)return;
  var tpl=defaultTemplateFor(pid);var text=gatherText(src);
  var tags=src.values.hashtags||src.values.keywords||[];var v={};
  if(pid==='x'){v.hook=src.title||src.values.topic;v.body=text.slice(0,140);v.coreMessage='';v.hashtags=tags.slice(0,2);}
  else if(pid==='instagram'){v.coverText=src.title||src.values.topic;v.firstLine=src.title||src.values.topic;v.body=text;
    v.cta='保存して後で見返してね。';v.hashtags=tags.slice(0,5);}
  else if(pid==='blog'){v.title=src.title||src.values.topic;v.intro=text.split('\n')[0]||'';v.body=text;
    v.points='';v.outro='';v.hashtags=tags;}
  else if(pid==='youtube'){v.seoTitle=(src.title||src.values.topic||'').slice(0,30);v.description=text.slice(0,400);
    v.thumbnailText=(src.title||src.values.topic||'').slice(0,15);
    v.coreContent=text.split('\n').slice(0,3).join('\n');
    v.chapters='00:00 オープニング\n01:00 本題\n03:00 まとめ';v.hashtags=tags.slice(0,5);}
  else if(pid==='wakuwaku'){v.oneLine=(src.title||src.values.topic||'').slice(0,30);v.selfIntro=text.slice(0,300);}

function assembleText(c){var tpl=getTemplate(c.templateId);var lines=[c.title];

  for(var i=0;i<tpl.fields.length;i++){var f=tpl.fields[i];var v=c.values[f.key];if(!v)continue;
    if(f.type==='tags'){lines.push(v.map(function(x){return '#'+x;}).join(' '));}
    else if(f.type!=='image'){lines.push(String(v));}}
  return lines.join('\n');}

var AI_MODELS_DEFAULT=['gemini-1.5-flash','gemini-1.5-pro','gemini-2.0-flash'];
function getAiKey(){return storeGet('bmen_ai_key')||'';}
function saveAiKey(){var el=document.getElementById('aiKeyInput');if(!el)return;
  storeSet('bmen_ai_key',el.value.trim());toast('APIキーを保存しました');}
function getModelList(){
  var raw=(storeGet('bmen_ai_models')||'').trim();
  if(!raw)return [];
  return raw.split(/[,;\s]+/).filter(Boolean);
}
function saveModelList(arr){storeSet('bmen_ai_models',arr.join(', '));}
function addModel(){
  var el=document.getElementById('aiModelAdd');if(!el)return;

function removeModel(name){
  var list=getModelList().filter(function(m){return m!==name;});
  saveModelList(list);
  if((storeGet('bmen_ai_last_ok')||'')===name)storeSet('bmen_ai_last_ok','');
  toast('モデルを削除しました: '+name);
  render();
}
function getAiModelChain(){
  var base=getModelList();
  if(!base.length)base=AI_MODELS_DEFAULT.slice();
  var last=(storeGet('bmen_ai_last_ok')||'').trim();
  if(last){base=[last].concat(base.filter(function(m){return m!==last;}));}
  return base;
}
function discoverModels(){
  var key=getAiKey();
  if(!key){toast('先にAPIキーを保存してください');return;}
  toast('利用可能なモデルを検索中…');
  fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key)+'&pageSize=100')
  .then(function(r){return r.json();}).then(function(j){
    if(j&&j.error){toast('検索失敗: '+j.error.message);return;}
    var names=(j.models||[]).map(function(m){return String(m.name||'').replace(/^models\//,'');});
    var usable=names.filter(function(n){return /^gemini/.test(n)&&
      !/embedding|tts|aqa|imagen|image|research|computer|music|vision-only/i.test(n);});
    usable.sort(function(a,b){
      var pa=/flash/.test(a)?0:(/pro/.test(a)?1:2);
      var pb=/flash/.test(b)?0:(/pro/.test(b)?1:2);
      return pa-pb;});
    if(!usable.length){toast('利用可能なモデルが見つかりません');return;}
    var list=getModelList();
    var added=0;
    usable.forEach(function(m){if(list.indexOf(m)===-1){list.push(m);added++;}});
    saveModelList(list);
    storeSet('bmen_ai_last_ok','');
    toast('モデル'+added+'個を追加しました（合計'+list.length+'個）');render();
  }).catch(function(e){toast('検索失敗: '+((e&&e.message)?e.message:e));});
}
function aiFetch(parts){
  var key=getAiKey();
  if(!key){toast('設定でGemini APIキーを入力してください');nav('settings');return Promise.reject('nokey');}
  var chain=getAiModelChain();
  function tryNext(i){
    if(i>=chain.length)return Promise.reject(new Error('利用可能なGeminiモデルがありません。設定でモデルを追加してください'));
    var model=chain[i];
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:parts}],
        generationConfig:{responseMimeType:'application/json',temperature:0.8}})
    }).then(function(r){return r.json();}).then(function(j){
      if(j&&j.error){var msg=String(j.error.message||'APIエラー');
        if(/no longer available|not found|not exist|deprecated|404|permission/i.test(msg))return tryNext(i+1);
        throw new Error(msg);}
      storeSet('bmen_ai_last_ok',model);
      var textContent='';
      try{
        if(j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts){
          textContent=j.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
        }
      }catch(e){throw new Error('応答形式が不正です');}
      return textContent;});
  }
  return tryNext(0);
}
function aiCall(prompt){return aiFetch([{text:prompt}]);}
function parseAiJson(txt){
  if(!txt) return null;
  try{return JSON.parse(txt);}catch(e){}
  var a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  if(a>-1&&b>a){try{return JSON.parse(txt.slice(a,b+1));}catch(e){}}
  return null;
}
function aiRulesFor(pid){
  if(pid==='x')return 'Xへの投稿。全角140字以内、1行目のフックが必須、ハッシュタグは最大2個、溢れる内容はスレッド用に分ける。';
  if(pid==='threads')return 'Threadsへの投稿。150〜300文字が最適（最大500）。ハッシュタグは使わずトピックタグを1つだけ。';
  if(pid==='instagram')return 'Instagramへの投稿。カバー文言30字以内、キャプション1行目が勝負、ハッシュタグ3〜5個、保存・シェアを促すCTA。';
  if(pid==='blog')return 'BLOG記事。タイトル32字以内、メタディスクリプション70字以内、導入は結論先出し、本文はセクション毎300〜500字、まとめ必須。';
  if(pid==='note')return 'note記事。タイトル15〜25文字、リード文は結論先出し、段落80〜150文字、長い場合は目次、文末にフォロー・スキ案内。';
  if(pid==='youtube')return 'YouTube台本。タイトル30字以内でキーワードを前半に、説明欄は冒頭150文字に要点、サムネイル文言は短く、チャプター付き、ハッシュタグ3〜5個。';
  if(pid==='wakuwaku')return 'ワクワクメール用プロフィール。一口コメントは最初の30文字に勢い、自己紹介は200〜300文字（始めた理由＋趣味＋誠実さ）。';
  return '投稿。1行目のフック、簡潔な本文、ハッシュタグは少なめ。';
}
function aiPromptFor(src,pid,tpl){
  var keys=tpl.fields.map(function(f){return f.key;});
  var srcText=gatherText(src)+'\nタイトル: '+(src.title||src.values.topic||'');
  if(src.values.csvData)srcText+='\n添付CSVデータ:\n'+src.values.csvData;
  return 'あなたは日本語SNS運用の専門家です。以下の元コンテンツから指定プラットフォーム向けの投稿下書きを作成してください。\n'+
  'プラットフォーム: '+getPlatform(pid).name+'\nルール: '+aiRulesFor(pid)+'\n'+
  '出力はJSONのみ。キー: '+keys.join(', ')+'\n'+
  '注意: hashtags/tagsキーは文字列の配列（#は付けない）、それ以外は文字列。各プラットフォームの文字数制限を必ず守る。日本語で書く。\n'+
  '元コンテンツ:\n'+srcText;
}
function aiConvert(srcId,pid){
  var src=findIn(db.contents,srcId);if(!src)return;
  var tpl=defaultTemplateFor(pid);
  toast('AIが '+getPlatform(pid).name+' の下書きを生成中…');
  aiCall(aiPromptFor(src,pid,tpl)).then(function(txt){
    var obj=parseAiJson(txt);
    if(!obj){toast('AI応答を解析できませんでした');return;}
    var v={};
    tpl.fields.forEach(function(f){
      var val=obj[f.key];
      if(f.type==='tags'){
        v[f.key]=Array.isArray(val)?val.map(String):String(val||'').split(/[\s,]+/).filter(Boolean);
      }else{v[f.key]=(val==null?'':String(val));}
    });
    var d=null;
    for(var i=0;i<db.contents.length;i++){var o=db.contents[i];
      if(o.sourceContentId===src.id&&o.platformId===pid){d=o;break;}}
    if(d){for(var k in v){d.values[k]=v[k];} d.updatedAt=nowISO();}
    else{d={id:uid(),platformId:pid,templateId:tpl.id,title:src.title||src.values.topic||'',status:'draft',
      publishAt:'',sourceContentId:src.id,createdAt:nowISO(),updatedAt:nowISO(),values:v};
      db.contents.unshift(d);}
    save();toast(getPlatform(pid).name+' のAI下書きが完成');render();
  }).catch(function(err){if(err!=='nokey')toast('AIエラー: '+((err&&err.message)?err.message:err));});
}
function aiAll(srcId){
  var src=findIn(db.contents,srcId);if(!src)return;
  if(!getAiKey()){toast('設定でGemini APIキーを入力してください');nav('settings');return;}
  var pids=DERIV_PLATFORMS();var i=0;
  (function next(){
    if(i>=pids.length){toast('全プラットフォームのAI生成が完了しました');return;}

}

var newSrc={title:'',csvText:'',csvRows:0,comment:'',images:[]};

function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch!=='\r')cur+=ch;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function onCsvFile(el){var f=el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var rows=parseCSV(String(r.result||''));
    newSrc.csvRows=rows.length;
    newSrc.csvText=rows.map(function(x){return x.join(' | ');}).join('\n').slice(0,4000);
    render();toast('CSVを取り込みました（'+rows.length+'行）');};
  r.readAsText(f);el.value='';}
function onImgFiles(el){
  var files=Array.prototype.slice.call(el.files);
  var room=3-newSrc.images.length;
  if(room<=0){toast('画像は最大3枚まで');el.value='';return;}
  files=files.slice(0,room);
  var pending=files.length;
  files.forEach(function(f){
    if(f.size>2*1024*1024){toast(f.name+' は2MB超のためスキップしました');
      if(--pending===0)render();return;}
    var r=new FileReader();
    r.onload=function(){var url=String(r.result);
      var i=url.indexOf(',');var b64=i>-1?url.slice(i+1):'';
      newSrc.images.push({src:url,mime:f.type||'image/png',b64:b64});
      if(--pending===0){render();toast('画像を取り込みました');}};
    r.readAsDataURL(f);});
  el.value='';}
function removeNewImg(i){newSrc.images.splice(i,1);render();}

  if(d.fields.length<=1){toast('フィールドは最低1つ必要です');return;}
  d.fields.splice(i,1);render();}
function saveTpl(){var d=state.tplDraft;if(!d)return;
  if(!d.name||!d.name.trim()){toast('テンプレート名を入力してください');return;}
  d.name=d.name.trim();
  if(!d.fields||!d.fields.length){toast('フィールドが必要です');return;}
  var seen={};
  d.fields.forEach(function(f,i){
    if(!f.key||!String(f.key).trim())f.key='field'+(i+1);
    f.key=String(f.key).trim().replace(/\s+/g,'_');
    if(seen[f.key])f.key=f.key+'_'+(i+1);
    seen[f.key]=1;
    if(!f.label||!String(f.label).trim())f.label=f.key;
    if(f.type!=='tags')delete f.maxTags;
    if(!f.limit)delete f.limit;
    if(!f.help)delete f.help;
    if(!f.placeholder)delete f.placeholder;
  });
  var idx=-1;
  for(var i=0;i<TEMPLATES.length;i++){if(TEMPLATES[i].id===d.id){idx=i;break;}}
  if(idx>=0)TEMPLATES[idx]=d;else TEMPLATES.push(d);
  saveTemplates();toast('テンプレートを保存しました');nav('templates');}
function delTpl(id){
  if(TEMPLATES.length<=1){toast('最後のテンプレートは削除できません');return;}
  if(!confirm('このテンプレートを削除しますか？'))return;
  TEMPLATES=TEMPLATES.filter(function(t){return t.id!==id;});
  saveTemplates();toast('テンプレートを削除しました');nav('templates');}

/* ========== 자동저장 ========== */
function updateCount(tElement){if(!tElement||!tElement.dataset||!tElement.dataset.f)return;
  var el=document.querySelector('[data-count="'+tElement.dataset.f+'"]');if(!el)return;
  var lim=parseInt(el.getAttribute('data-limit'),10)||0;
  var len=(tElement.value||'').length;
  el.textContent=len+'/'+lim;
  if(len>lim){el.classList.add('over');}else{el.classList.remove('over');}}
function onAutoSave(e){var tElement=e.target;if(state.view!=='edit')return;var c=current();if(!c)return;
  if(!c.values) c.values = {};
  if(tElement.dataset&&tElement.dataset.f){c.values[tElement.dataset.f]=tElement.value;updateCount(tElement);}
  else if(tElement.dataset&&tElement.dataset.sys){c[tElement.dataset.sys]=tElement.value;}
  else{return;}
  c.updatedAt=nowISO();save();flashSaved();}
document.addEventListener('input',onAutoSave);
document.addEventListener('change',onAutoSave);
document.addEventListener('keydown',function(e){
  var tElement=e.target;
  if(!tElement||!tElement.classList||!tElement.classList.contains('tag-input'))return;
  var c=current();if(!c)return;var key=tElement.dataset.tags;
  if(e.key==='Enter'||e.key===','){e.preventDefault();
    if(!c.values) c.values = {};
    var arr=c.values[key]||(c.values[key]=[]);
    var tpl=getTemplate(c.templateId);var fd=null;
    if(tpl && tpl.fields){
      for(var i=0;i<tpl.fields.length;i++){if(tpl.fields[i].key===key){fd=tpl.fields[i];break;}}
    }
    if(fd&&fd.maxTags&&arr.length>=fd.maxTags){toast('タグは最大'+fd.maxTags+'個まで');return;}
    var val=tElement.value.trim().replace(/^#/,'');
    if(val&&arr.indexOf(val)===-1){arr.push(val);c.updatedAt=nowISO();save();render();}
    else{tElement.value='';}}
  else if(e.key==='Backspace'&&tElement.value===''){
    var arr2=(c.values&&c.values[key])||[];
    if(arr2.length){arr2.pop();c.updatedAt=nowISO();save();render();}}
});
var flashT=null;
function flashSaved(){var el=$('#saveFlash');if(!el)return;
  el.textContent='✓ 自動保存 '+fmtDT(nowISO());el.classList.add('on');
  if(flashT)clearTimeout(flashT);flashT=setTimeout(function(){el.classList.remove('on');},1200);}
var toastT=null;
function toast(msg){var el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');
  if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},1800);}

        var o=db.contents[i];

      if(d){return '<button class="btn btn-ghost sm" onclick="openEdit(\''+d.id+'\')">'+pdot(pid)+' '+statusOf(d.status).label+'</button>';}
      return '<button class="btn btn-outline sm" onclick="convertTo(\''+c.id+'\',\''+pid+'\')">＋ '+getPlatform(pid).name+'</button>';
    }).join('');
    return '<div class="card"><div class="sechead">'+
      (c.platformId==='source'?'<span class="plat"><i style="background:#94a3b8"></i>元</span>':pdot(c.platformId))+
      '<span>'+(esc(c.title)||'（無題）')+'</span>'+badge(c.status)+
      '<span class="muted" style="margin-left:auto">'+fmtDT(c.updatedAt)+'</span>'+
      '<button class="btn btn-ghost sm" onclick="openEdit(\''+c.id+'\')">'+t('open')+'</button>'+
      '<button class="btn btn-danger sm" onclick="del(\''+c.id+'\')">'+t('delete')+'</button></div>'+
      '<div class="quickbar">'+chips+'</div>'+
      '<div class="quickbar" style="margin-top:8px"><button class="btn btn-primary sm" onclick="aiAll(\''+c.id+'\')">✨ AI一括生成（全プラットフォーム）</button></div></div>';}).join('');
  return html;}

function viewList(){var items=db.contents
  .filter(function(c){return state.platform?c.platformId===state.platform:true;})
  .filter(function(c){return state.statusFilter==='all'?true:c.status===state.statusFilter;})
  .filter(function(c){return state.query?(c.title||'').indexOf(state.query)!==-1:true;})
  .sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
  var title=state.platform?getPlatform(state.platform).name+' のコンテンツ':t('createContent');
  return '<div class="sechead big">'+title+' <span class="muted">'+items.length+'件</span>'+
    '<select class="filter" onchange="setStatusFilter(this.value)">'+
      '<option value="all">'+t('status')+'：すべて</option>'+
      STATUSES.map(function(s){return '<option value="'+s.id+'"'+(state.statusFilter===s.id?' selected':'')+'>'+t(s.label)+'</option>';}).join('')+
    '</select></div>'+
    '<div class="card"><table class="tbl">'+getTableHead()+'<th>'+t('action')+'</th>'+contentRows(items,true)+'</table></div>';}

function fieldHTML(c,f){
  var v=(c.values && c.values[f.key]) ? c.values[f.key] : '';
  var req=f.required?' <span class="req">*</span>':'';
  var help=f.help?'<div class="help">'+esc(f.help)+'</div>':'';
  var counter=function(val){if(!f.limit)return '';
    var len=(val||'').length;
    return '<div class="count'+(len>f.limit?' over':'')+'" data-count="'+f.key+'" data-limit="'+f.limit+'">'+len+'/'+f.limit+'</div>';};
  if(f.type==='textarea'){return '<div class="field"><label>'+esc(f.label)+req+'</label>'+
    '<textarea data-f="'+f.key+'" class="'+(f.big?'big':'')+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(v||'')+'</textarea>'+
    counter(v)+help+'</div>';}
  if(f.type==='tags'){var arr=Array.isArray(v)?v:[];
    return '<div class="field"><label>'+esc(f.label)+req+
    (f.maxTags?' <span class="muted">（最大'+f.maxTags+'個）</span>':'')+'</label>'+
    '<div class="tagbox">'+arr.map(function(tTag,i){
      return '<span class="chip">#'+esc(tTag)+'<button class="chipx" onclick="removeTag(\''+c.id+'\',\''+f.key+'\','+i+')">×</button></span>';}).join('')+
    '<input class="tag-input" data-tags="'+f.key+'" placeholder="Enterで追加"></div>'+help+'</div>';}
  if(f.type==='image'){return '<div class="field"><label>'+esc(f.label)+'</label>'+
    '<input data-f="'+f.key+'" value="'+esc(v||'')+'" placeholder="https://...">'+
    (v?'<img class="imgprev" src="'+esc(v)+'" onerror="this.style.display=\'none\'">':'')+help+'</div>';}
  return '<div class="field"><label>'+esc(f.label)+req+'</label>'+
    '<input type="'+(f.type==='url'?'url':'text')+'" data-f="'+f.key+'" value="'+esc(v||'')+'" placeholder="'+esc(f.placeholder||'')+'">'+
    counter(v)+help+'</div>';}

function viewEdit(){var c=current();
  if(!c)return '<div class="card">コンテンツが見つかりません</div>';
  var tpl=getTemplate(c.templateId);
  var src=c.sourceContentId?findIn(db.contents,c.sourceContentId):null;
  var derived=db.contents.filter(function(o){return o.sourceContentId===c.id;});
  var targets=PLATFORMS.filter(function(p){return p.id!==c.platformId&&p.id!=='source';});
  var backOnclick=(c.platformId==='source')?'nav(\'source\')':'nav(\'list\',{platform:\''+c.platformId+'\'})';
  var toggle='<div style="margin-left:auto;display:flex;gap:6px">'+
    '<button class="btn sm '+(!state.preview?'btn-primary':'btn-ghost')+'" onclick="setPreview(false)">'+t('edit')+'</button>'+
    '<button class="btn sm '+(state.preview?'btn-primary':'btn-ghost')+'" onclick="setPreview(true)">プレビュー</button></div>';
  var crumb='<div class="crumb">'+
    '<button class="btn btn-ghost" onclick="'+backOnclick+'">← 戻る</button>'+
    pdot(c.platformId)+' <span class="muted">'+esc(tpl.name)+'</span>'+toggle+'</div>';
  var actions='<div class="actions">'+
    '<button class="btn btn-primary" onclick="copyText(\''+c.id+'\')">投稿用コピー</button>'+
    '<button class="btn btn-ghost" onclick="aiOptimize(\''+c.id+'\')">✨ AI最適化</button>'+
    targets.map(function(p){return '<button class="btn btn-outline" onclick="convertTo(\''+c.id+'\',\''+p.id+'\')">'+p.name+'用に変換</button>';}).join('')+
    '<button class="btn btn-danger" style="margin-left:auto" onclick="del(\''+c.id+'\')">'+t('delete')+'</button>'+
    '<span id="saveFlash"></span></div>';
  if(state.preview){
    return crumb+
    '<div class="card"><div class="sechead">'+pdot(c.platformId)+' プレビュー</div>'+previewHTML(c)+'</div>'+
    ((src||derived.length)?'<div class="card"><div class="sechead">リンク</div>'+
      (src?'<div>元コンテンツ：<button class="btn btn-ghost sm" onclick="openEdit(\''+src.id+'\')">'+(esc(src.title)||'（無題）')+'</button></div>':'')+
      (derived.length?'<div style="margin-top:8px">派生コンテンツ：'+derived.map(function(d){
        return '<button class="btn btn-ghost sm" onclick="openEdit(\''+d.id+'\')">'+pdot(d.platformId)+' '+(esc(d.title)||'（無題）')+'</button>';}).join(' ')+'</div>':'')+
    '</div>':'')+actions;}
  var fieldsHTML = (tpl && tpl.fields) ? tpl.fields.map(function(f){return fieldHTML(c,f);}).join('') : '';
  var html=crumb+
  '<div class="card">'+
    '<div class="field full"><label>'+t('title')+'（管理用）</label>'+
      '<input data-sys="title" value="'+esc(c.title)+'" placeholder="タイトルを入力"></div>'+
    '<div class="fgrid">'+
    fieldsHTML+
    '<div class="row2 full">'+
      '<div class="field"><label>'+t('status')+'</label><select data-sys="status">'+
        STATUSES.map(function(s){return '<option value="'+s.id+'"'+(c.status===s.id?' selected':'')+'>'+t(s.label)+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label>'+t('pubDate')+'</label>'+
        '<input type="datetime-local" data-sys="publishAt" value="'+(c.publishAt||'')+'"></div>'+
    '</div></div></div>';
  if(src||derived.length){
    html+='<div class="card"><div class="sechead">リンク</div>';
    if(src){html+='<div>元コンテンツ：<button class="btn btn-ghost sm" onclick="openEdit(\''+src.id+'\')">'+(esc(src.title)||'（無題）')+'</button></div>';}
    if(derived.length){html+='<div style="margin-top:8px">派生コンテンツ：'+
      derived.map(function(d){return '<button class="btn btn-ghost sm" onclick="openEdit(\''+d.id+'\')">'+pdot(d.platformId)+' '+(esc(d.title)||'（無題）')+'</button>';}).join(' ')+'</div>';}
    html+='</div>';}
  return html+actions;}

function viewNewPlatform(){var distPlats=PLATFORMS.filter(function(p){return p.id!=='source';});
  return '<div class="sechead big">'+t('newCreate')+' — プラットフォームを選択</div>'+
  '<div class="platgrid">'+distPlats.map(function(p){
    return '<div class="card pcard" onclick="createFromPlatform(\''+p.id+'\')">'+
    pdot(p.id)+'<div class="pname">'+p.name+'</div>'+
    '<div class="muted">'+esc(defaultTemplateFor(p.id).name)+'</div></div>';}).join('')+'</div>';}

function viewNewTemplate(){return '<div class="sechead big">'+t('createFromTpl')+'</div>'+
  PLATFORMS.map(function(p){var ts=TEMPLATES.filter(function(tpl){return tpl.platform===p.id;});
    if(!ts.length)return '';
    return '<div class="card"><div class="sechead">'+pdot(p.id)+'</div><div class="quickbar">'+
      ts.map(function(tpl){return '<button class="btn btn-outline" onclick="createFromTemplate(\''+tpl.id+'\')">'+esc(tpl.name)+'</button>';}).join('')+
    '</div></div>';}).join('');}

function viewTemplates(){return '<div class="sechead big">'+t('templates')+'一覧'+
  '<button class="btn btn-primary" style="margin-left:auto" onclick="newTpl()">＋ 新規'+t('templates')+'</button></div>'+
  TEMPLATES.map(function(tpl){return '<div class="card"><div class="sechead">'+esc(tpl.name)+' '+pdot(tpl.platform)+
    '<button class="btn btn-ghost sm" style="margin-left:auto" onclick="openTplEdit(\''+tpl.id+'\')">'+t('edit')+'</button></div>'+
    '<div class="flist">'+tpl.fields.map(function(f){
      return '<div class="frow"><span>'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+
      (f.limit?' <span class="muted">（'+f.limit+'字）</span>':'')+
      (f.maxTags?' <span class="muted">（最大'+f.maxTags+'個）</span>':'')+'</span>'+
      '<span class="ftype">'+f.type+'</span></div>'+
      (f.help?'<div class="help" style="padding:0 0 6px">'+esc(f.help)+'</div>':'');}).join('')+'</div></div>';}).join('');}

function viewPublish(){var items=db.contents
  .filter(function(c){return c.status==='scheduled'||c.status==='published';})
  .sort(function(a,b){return (a.publishAt||'9999').localeCompare(b.publishAt||'9999');});
  return '<div class="sechead big">'+t('publishMgmt')+' <span class="muted">'+items.length+'件</span></div>'+
  '<div class="card"><table class="tbl">'+getTableHead()+contentRows(items)+'</table></div>';}

function viewLinks(){
  var d=state.linkDraft;
  var editor='';
  if(d){
    editor='<div class="card" style="border-color:var(--accent)"><div class="sechead">'+(d.id?'リンク編集':'新規リンク')+
      '<button class="btn btn-ghost sm" style="margin-left:auto" onclick="cancelLink()">'+t('cancel')+'</button></div>'+
      '<div class="row2">'+
        '<div class="field"><label>名前</label><input value="'+esc(d.name)+'" oninput="state.linkDraft.name=this.value" placeholder="例：X、メモ帳、証券口座…"></div>'+
        '<div class="field"><label>URL</label><input value="'+esc(d.url||'')+'" oninput="state.linkDraft.url=this.value" placeholder="https://..."></div>'+
      '</div>'+
      '<div class="row2">'+
        '<div class="field"><label>カラー</label><input type="color" value="'+esc(d.color||'#c9a87c')+'" oninput="state.linkDraft.color=this.value"></div>'+
        '<div class="field"><label>ドメイン（ロゴ自動取得用・任意）</label><input value="'+esc(d.domain||'')+'" oninput="state.linkDraft.domain=this.value" placeholder="example.com"></div>'+
      '</div>'+
      '<div class="quickbar"><button class="btn btn-primary" onclick="saveLink()">'+t('save')+'</button>'+
      '<button class="btn btn-ghost" onclick="autoColor()">🎨 自動パステルカラー</button></div></div>';
  }
  var rows=LINKLIST.map(function(l){
    return '<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:0">'+
      logoHTML(l)+
      '<div style="flex:1;min-width:0"><div class="qname" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(l.name)+'</div>'+
      '<div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(l.url||'URL未設定')+'</div></div>'+
      '<button class="btn btn-ghost sm" onclick="editLink(\''+l.id+'\')">'+t('edit')+'</button>'+
      '<button class="btn btn-danger sm" onclick="delLink(\''+l.id+'\')">'+t('delete')+'</button></div>';}).join('');
  return '<div class="sechead big">'+t('quickLinks')+' <span class="muted">'+LINKLIST.length+'件</span>'+
    '<button class="btn btn-primary" style="margin-left:auto" onclick="newLink()">＋ 新規リンク</button></div>'+
    '<p class="muted" style="margin-bottom:10px">追加・編集したリンクはダッシュボードのクイックリンクにすぐ反映されます。</p>'+
    editor+
    '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">'+rows+'</div>';}

function viewSettings(){
  var mList=getModelList();
  var chips=mList.length
    ? mList.map(function(m){return '<span class="chip">'+esc(m)+
        '<button class="chipx" onclick="removeModel(\''+esc(m)+'\')">×</button></span>';}).join('')
    : '<span class="muted" style="font-size:12px">（リスト空欄＝既定リストを自動使用）</span>';
  return '<div class="sechead big">'+t('settings')+'</div>'+
  '<div class="card"><div class="sechead">AI（Gemini）設定</div>'+
    '<p class="muted" style="margin-bottom:8px">Google AI Studio（aistudio.google.com）のAPIキーを入力してください。</p>'+
    '<div class="field"><label>Gemini API Key</label>'+
    '<input id="aiKeyInput" type="password" placeholder="AIza..." value="'+esc(getAiKey())+'"></div>'+
    '<div class="quickbar"><button class="btn btn-primary" onclick="saveAiKey()">キーを保存</button>'+
    '<button class="btn btn-outline" onclick="discoverModels()">🔍 利用可能モデルを自動検索</button></div>'+
    '<div class="field" style="margin-top:12px"><label>使用するモデルリスト（上から順に試行・×で選択解除）</label>'+
    '<div class="tagbox" style="margin-bottom:6px">'+chips+'</div>'+
    '<div style="display:flex;gap:6px">'+
      '<input id="aiModelAdd" placeholder="例: gemini-1.5-pro" onkeydown="if(event.key===\'Enter\'){addModel();}">'+
      '<button class="btn btn-ghost" onclick="addModel()">＋ 追加</button></div>'+
    '<div class="help" style="margin-top:6px">直近成功モデル: '+esc(storeGet('bmen_ai_last_ok')||'（未確定）')+
    ' ／ 成功したモデルは次回から最初に試行されます</div></div></div>'+
  '<div class="card"><div class="sechead">データ管理</div>'+
    '<p class="muted" style="margin-bottom:12px">データ・テンプレート・リンクはこのブラウザ（localStorage）に保存されます。バックアップはエクスポートを使ってください。</p>'+
    '<div class="quickbar">'+
      '<button class="btn btn-primary" onclick="exportData()">エクスポート（JSON）</button>'+
      '<button class="btn btn-outline" onclick="document.getElementById(\'importFile\').click()">インポート</button>'+
      '<button class="btn btn-ghost" onclick="resetSeed()">サンプルデータに戻す</button>'+
      '<button class="btn btn-danger" onclick="clearAll()">全データ消去</button>'+
    '</div></div>'+
  '<div class="card"><div class="sechead">現在のデータ</div>'+
    '<p>コンテンツ数：'+db.contents.length+'件 ／ テンプレート数：'+TEMPLATES.length+'個 ／ リンク数：'+LINKLIST.length+'個</p></div>';}

/* ========== 렌더 ========== */
var views={dashboard:viewDashboard,source:viewSource,'new-source':viewNewSource,list:viewList,edit:viewEdit,
  'new-platform':viewNewPlatform,'new-template':viewNewTemplate,templates:viewTemplates,'tpl-edit':viewTplEdit,
  publish:viewPublish,links:viewLinks,settings:viewSettings,platforms:viewPlatformsList,'plat-edit':viewPlatformEdit};
function render(){
  var items=document.querySelectorAll('.menu-item');
  for(var i=0;i<items.length;i++)items[i].classList.remove('active');
  var key='dashboard';
  if(state.view==='source'||state.view==='new-source')key='source';
  else if(state.view==='platforms'||state.view==='plat-edit')key='platforms';
  else if(state.view==='list')key=state.platform?('list-'+state.platform):'list-all';
  else if(state.view==='edit'){var c=current();
    key=c?((c.platformId==='source')?'source':('list-'+c.platformId)):'list-all';}
  else if(state.view==='templates'||state.view==='tpl-edit')key='templates';
  else if(state.view==='publish')key='publish';
  else if(state.view==='links')key='links';
  else if(state.view==='settings')key='settings';
  else if(state.view==='new-platform'||state.view==='new-template')key='list-all';
  var el=document.querySelector('[data-m="'+key+'"]');
  if(el)el.classList.add('active');
  var fn=views[state.view]||viewDashboard;
  try{
    var targetEl = $('#content');
    if(targetEl) targetEl.innerHTML=fn();
  }
  catch(err){
    var targetEl = $('#content');
    if(targetEl) targetEl.innerHTML='<div class="card">表示エラー: '+esc(err.message)+'</div>';
  }
}
function sidebarHTML(){var distPlats=PLATFORMS.filter(function(p){return p.id!=='source';});
  return '<div class="sidebar"><div class="logo">B面サイト管理 v12</div>'+
  '<div class="menu-item" data-m="dashboard" onclick="nav(\'dashboard\')">'+t('dashboard')+'</div>'+
  '<div class="menu-item" data-m="source" onclick="nav(\'source\')">'+t('source')+'</div>'+
  '<div class="menu-item" data-m="platforms" onclick="nav(\'platforms\')">'+t('menuMgmt')+'</div>'+
  '<div class="menu-item" data-m="list-all" onclick="nav(\'list\',{platform:null})">'+t('createContent')+'</div>'+
  distPlats.map(function(p){return '<div class="menu-item sub" data-m="list-'+p.id+'" onclick="nav(\'list\',{platform:\''+p.id+'\'})">'+p.name+'</div>';}).join('')+
  '<div class="spec-spacing"></div>'+
  '<div class="menu-item" data-m="templates" onclick="nav(\'templates\')">'+t('templates')+'</div>'+
  '<div class="menu-item" data-m="publish" onclick="nav(\'publish\')">'+t('publishMgmt')+'</div>'+
  '<div class="menu-item" data-m="links" onclick="nav(\'links\')">'+t('quickLinks')+'</div>'+
  '<div class="menu-item" data-m="settings" onclick="nav(\'settings\')">'+t('settings')+'</div></div>';}

function mainLayoutHTML(){
  var langOptions = LANGS.map(function(l){
    return '<option value="'+l.id+'"'+(currentLang===l.id?' selected':'')+'>'+l.label+'</option>';
  }).join('');
  return '<div class="main"><div class="topbar"><div class="tb-title">'+t('sysTitle')+'</div>'+
    '<input id="searchBox" placeholder="'+t('search')+'" oninput="onSearch(this.value)">'+
    '<button class="btn btn-primary" onclick="nav(\'new-platform\')">'+t('newCreate')+'</button>'+
    '<button class="btn btn-outline" onclick="nav(\'new-template\')">'+t('createFromTpl')+'</button>'+
    '<select id="langSelect" onchange="changeLang(this.value)">'+langOptions+'</select></div>'+
    '<div id="content"></div>'+
    '<input type="file" id="importFile" accept="application/json" style="display:none" onchange="doImport(this)"></div>';
}

/* ========== 시작 ========== */
try{
  var appEl = $('#app');
  if(appEl){
    appEl.innerHTML=sidebarHTML()+mainLayoutHTML();
  }
  render();
}catch(e){
  document.body.innerHTML='<pre style="padding:20px;color:#8c3a3a">初期化エラー: '+e.message+'</pre>';
}
</script>
</body>
</html>
